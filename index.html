<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokédex</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="pokedex">

        
        <header class="pokedex-top">

            <div class="camera"></div>

            <div class="lights">
                <span class="light red"></span>
                <span class="light yellow"></span>
                <span class="light green"></span>
            </div>

        </header>


        <div class="top-line"></div>


        <!-- TELA -->
        <section class="screen-container">

            <div class="screen">

                <div class="screen-content">

                    <span id="pokemon-number">
                        #025
                    </span>

                    <img
                        id="pokemon-image"
                        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png"
                        alt="Pokémon"
                    >

                    <h1 id="pokemon-name">
                        Pikachu
                    </h1>

                    <div class="types" id="pokemon-types">
                        <span class="type eletric">
                            ELÉTRICO
                        </span>
                    </div>

                    <div class="pokemon-info">

                        <div>
                            <strong>Altura</strong>
                            <span id="pokemon-height">0.4 m</span>
                        </div>

                        <div>
                            <strong>Peso</strong>
                            <span id="pokemon-weight">6.0 kg</span>
                        </div>

                    </div>

                </div>

            </div>

          
            <div class="screen-bottom">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>

        </section>


       
        <section class="controls">

            <div class="search-area">

                <input
                    type="text"
                    id="search-input"
                    placeholder="Nome ou número"
                    autocomplete="off"
                >

                <button id="search-button">
                    Buscar
                </button>

            </div>


            <div class="navigation">

                <button id="previous-button">
                    ◀ Anterior
                </button>

                <button id="random-button">
                    Aleatório
                </button>

                <button id="next-button">
                    Próximo ▶
                </button>

            </div>


            
            <div class="device-controls">

                <div class="round-button"></div>

                <div class="small-buttons">
                    <span></span>
                    <span></span>
                </div>

                <div class="direction">

                    <div class="horizontal"></div>
                    <div class="vertical"></div>

                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
